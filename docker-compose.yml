services:
  agent:
    build: .
    ports:
      - "7860:7860"
    env_file: .env
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
